<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech - Acervo de Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 BiblioTech - Acervo de Biblioteca</h1>

        <div id="alert-box" class="alert hidden"></div>

        <div class="card">
            <h2 id="form-title">Cadastrar Novo Livro</h2>
            <form id="livro-form">
                <input type="hidden" id="livro-id">
                
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" required minlength="3" maxlength="150">
                </div>

                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" required>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN:</label>
                    <input type="text" id="isbn" required>
                </div>

                <div class="form-group">
                    <label for="genero">Gênero:</label>
                    <input type="text" id="genero" required>
                </div>

                <div class="form-group">
                    <label for="exemplares">Nº de Exemplares:</label>
                    <input type="number" id="exemplares" min="0" required>
                </div>

                <div class="actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">Salvar</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary hidden" onclick="resetForm()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Livros Cadastrados</h2>
            <table id="livros-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                        <th>Gênero</th>
                        <th>Exemplares</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="livros-list">
                    <!-- Preenchido dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
